<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bot Shot - Space Basketball</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { 
            font-family: 'Fredoka', sans-serif; 
            background: #000; 
            overflow: hidden; 
            user-select: none; 
        }
        
        #gameCanvas { display: block; }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(10,10,30,0.98), rgba(30,10,50,0.98));
        }
        
        .screen.active { display: flex; }
        
        .title-logo { 
            font-size: 80px; 
            font-weight: 800; 
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(0,255,255,0.5);
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .title-sub { 
            font-size: 24px; 
            color: #888; 
            margin-bottom: 50px; 
            letter-spacing: 6px;
        }
        
        .mascot {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            margin-bottom: 40px;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 20px 60px rgba(0,255,255,0.3);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .btn {
            padding: 22px 60px;
            font-size: 28px;
            font-weight: 800;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-family: inherit;
            background: linear-gradient(135deg, #00ff88, #00aa55);
            color: white;
            box-shadow: 0 10px 40px rgba(0,255,136,0.4);
            transition: transform 0.1s;
        }
        
        .btn:active { transform: scale(0.95); }
        
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        
        .hud-item {
            background: rgba(0,0,0,0.6);
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .power-bar {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 30px;
            background: rgba(0,0,0,0.6);
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.2);
            overflow: hidden;
            display: none;
        }
        
        .power-bar.active { display: block; }
        
        .power-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0f0, #ff0, #f80, #f00);
            transition: width 0.05s;
        }
        
        .wind-indicator {
            position: absolute;
            top: 90px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 12px;
            color: #0ff;
            font-size: 18px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        
        .wind-indicator.active { display: flex; }
        
        .combo {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: 800;
            color: #ff00ff;
            text-shadow: 0 0 30px rgba(255,0,255,0.8);
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s;
        }
        
        .combo.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }
        
        .game-over-title {
            font-size: 60px;
            font-weight: 800;
            margin-bottom: 20px;
        }
        
        .game-over-title.win {
            background: linear-gradient(135deg, #00ff88, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .game-over-title.lose {
            background: linear-gradient(135deg, #ff6666, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .final-score {
            font-size: 30px;
            color: #ff0;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="screen active" id="titleScreen">
        <div class="mascot">🏀</div>
        <div class="title-logo">BOT SHOT</div>
        <div class="title-sub">SPACE BASKETBALL</div>
        <button class="btn" onclick="startGame()">PLAY</button>
    </div>
    
    <div class="screen" id="gameOverScreen">
        <div class="game-over-title" id="endTitle">GAME OVER</div>
        <div class="final-score" id="finalScore">Score: 0</div>
        <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
    
    <div class="hud" id="hud" style="display: none;">
        <div class="hud-item">🏆 <span id="score">0</span></div>
        <div class="hud-item">🔥 <span id="streak">0</span></div>
        <div class="hud-item">LVL <span id="level">1</span></div>
        <div class="hud-item">❤️ <span id="shots">5</span></div>
    </div>
    
    <div class="power-bar" id="powerBar">
        <div class="power-fill" id="powerFill"></div>
    </div>
    
    <div class="wind-indicator" id="windIndicator">
        <span id="windArrow">💨</span>
        <span id="windText">0</span>
    </div>
    
    <div class="combo" id="combo">COMBO x2!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let gameState = 'title';
        let score = 0, level = 1, shots = 5, streak = 0;
        
        // Ball
        const ball = {
            x: 100, y: 0, r: 22,
            vx: 0, vy: 0,
            flying: false,
            charging: false,
            power: 0,
            angle: 0,
            trail: []
        };
        
        // Hoop
        const hoop = {
            x: 400, y: 250,
            w: 90, h: 8,
            moving: false,
            baseY: 250,
            moveOffset: 0
        };
        
        // Wind
        const wind = { strength: 0, dir: 1 };
        
        // Particles
        let particles = [];
        
        // Stars background
        const stars = [];
        for (let i = 0; i < 80; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random(),
                s: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.3 + 0.1
            });
        }
        
        // Resize
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        // Input
        let dragStart = null;
        
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
            }
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
        
        canvas.addEventListener('mousedown', onDown);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, { passive: false });
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('touchmove', e => { e.preventDefault(); onMove(e); }, { passive: false });
        canvas.addEventListener('mouseup', onUp);
        canvas.addEventListener('touchend', onUp);
        
        function onDown(e) {
            if (gameState !== 'playing' || ball.flying) return;
            const pos = getPos(e);
            const dist = Math.hypot(pos.x - ball.x, pos.y - ball.y);
            if (dist < 60) {
                dragStart = pos;
                ball.charging = true;
                document.getElementById('powerBar').classList.add('active');
            }
        }
        
        function onMove(e) {
            if (!dragStart) return;
            const pos = getPos(e);
            const dx = dragStart.x - pos.x;
            const dy = dragStart.y - pos.y;
            ball.angle = Math.atan2(dy, dx);
            ball.power = Math.min(Math.hypot(dx, dy) / 2.5, 100);
            document.getElementById('powerFill').style.width = ball.power + '%';
        }
        
        function onUp() {
            if (!dragStart || !ball.charging) return;
            const speed = ball.power / 2.5;
            ball.vx = Math.cos(ball.angle) * speed;
            ball.vy = Math.sin(ball.angle) * speed;
            ball.flying = true;
            ball.charging = false;
            ball.trail = [];
            dragStart = null;
            document.getElementById('powerBar').classList.remove('active');
        }
        
        function resetBall() {
            ball.x = Math.min(100, canvas.width * 0.15);
            ball.y = canvas.height - 150;
            ball.vx = 0;
            ball.vy = 0;
            ball.flying = false;
            ball.power = 0;
            ball.trail = [];
        }
        
        function setupLevel() {
            resetBall();
            
            // Progressive difficulty - safe positioning
            const minX = Math.max(300, canvas.width * 0.4);
            const maxX = canvas.width - 100;
            const distance = 200 + (level - 1) * 40;
            hoop.x = Math.max(minX, Math.min(canvas.width - distance, maxX));
            
            // Heights cycle through 3 positions
            const heights = [220, 280, 250];
            hoop.baseY = heights[(level - 1) % 3];
            hoop.y = hoop.baseY;
            hoop.moveOffset = 0;
            
            // Moving hoops after level 4
            hoop.moving = level > 4;
            
            // Wind after level 6
            if (level > 6) {
                wind.strength = Math.min((level - 6) * 0.03, 0.15);
                wind.dir = Math.random() > 0.5 ? 1 : -1;
                document.getElementById('windIndicator').classList.add('active');
                document.getElementById('windArrow').style.transform = `scaleX(${wind.dir})`;
                document.getElementById('windText').textContent = Math.round(wind.strength * 100);
            } else {
                wind.strength = 0;
                document.getElementById('windIndicator').classList.remove('active');
            }
            
            shots = 5;
            updateHUD();
        }
        
        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
            document.getElementById('level').textContent = level;
            document.getElementById('shots').textContent = shots;
        }
        
        function startGame() {
            gameState = 'playing';
            score = 0;
            level = 1;
            streak = 0;
            particles = [];
            document.getElementById('titleScreen').classList.remove('active');
            document.getElementById('gameOverScreen').classList.remove('active');
            document.getElementById('hud').style.display = 'flex';
            setupLevel();
        }
        
        function gameOver() {
            gameState = 'gameover';
            const title = document.getElementById('endTitle');
            const won = score > 0;
            title.textContent = won ? 'SWISH!' : 'GAME OVER';
            title.className = 'game-over-title ' + (won ? 'win' : 'lose');
            document.getElementById('finalScore').textContent = 'Score: ' + score;
            document.getElementById('gameOverScreen').classList.add('active');
            document.getElementById('hud').style.display = 'none';
        }
        
        function nextLevel() {
            streak++;
            score += 100 * level + (streak * 50);
            level++;
            
            // Show combo
            if (streak > 1) {
                const combo = document.getElementById('combo');
                combo.textContent = 'COMBO x' + streak + '!';
                combo.classList.add('show');
                setTimeout(() => combo.classList.remove('show'), 1000);
            }
            
            // Explosion particles
            for (let i = 0; i < 20; i++) {
                const angle = (Math.PI * 2 * i) / 20;
                const speed = 3 + Math.random() * 4;
                particles.push({
                    x: hoop.x + hoop.w/2,
                    y: hoop.y + 30,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    color: `hsl(${Math.random() * 60 + 30}, 100%, 50%)`,
                    size: 3 + Math.random() * 4
                });
            }
            
            setupLevel();
        }
        
        function drawBackground() {
            // Space gradient
            const grad = ctx.createRadialGradient(
                canvas.width/2, canvas.height/2, 0,
                canvas.width/2, canvas.height/2, canvas.height
            );
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(1, '#050310');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Stars
            ctx.fillStyle = '#fff';
            stars.forEach(s => {
                const alpha = 0.3 + Math.sin(Date.now() * 0.001 + s.x * 10) * 0.3;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(s.x * canvas.width, s.y * canvas.height, s.s, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            // Floor
            ctx.fillStyle = '#0a0a1e';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        }
        
        function drawHoop() {
            // Moving hoop
            if (hoop.moving) {
                hoop.moveOffset = Math.sin(Date.now() * 0.002) * 40;
                hoop.y = hoop.baseY + hoop.moveOffset;
            }
            
            // Rim glow
            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 20;
            ctx.strokeStyle = '#ff6600';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(hoop.x, hoop.y);
            ctx.lineTo(hoop.x + hoop.w, hoop.y);
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // Backboard
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(hoop.x + hoop.w - 5, hoop.y - 70, 10, 90);
            
            // Net
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            for (let i = 0; i <= 4; i++) {
                ctx.beginPath();
                ctx.moveTo(hoop.x + (i * hoop.w / 4), hoop.y);
                ctx.lineTo(hoop.x + 10 + (i * hoop.w / 4), hoop.y + 50);
                ctx.stroke();
            }
        }
        
        function drawBall() {
            // Trail
            ball.trail.forEach((p, i) => {
                const alpha = (i / ball.trail.length) * 0.5;
                ctx.fillStyle = `rgba(0, 200, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, ball.r * 0.6 * (i / ball.trail.length), 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Ball
            const g = ctx.createRadialGradient(
                ball.x - 6, ball.y - 6, 0,
                ball.x, ball.y, ball.r
            );
            g.addColorStop(0, '#00ffff');
            g.addColorStop(0.5, '#00aadd');
            g.addColorStop(1, '#006699');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
            
            // Shine
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(ball.x - 7, ball.y - 7, 7, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawAim() {
            if (!ball.charging) return;
            
            // Aim line
            ctx.strokeStyle = '#ff0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(ball.x + Math.cos(ball.angle) * 100, ball.y + Math.sin(ball.angle) * 100);
            ctx.stroke();
            
            // Trajectory dots
            ctx.fillStyle = 'rgba(0,255,255,0.6)';
            let px = ball.x, py = ball.y;
            let pvx = Math.cos(ball.angle) * (ball.power / 2.5);
            let pvy = Math.sin(ball.angle) * (ball.power / 2.5);
            
            for (let i = 0; i < 15; i++) {
                px += pvx;
                py += pvy;
                pvy += 0.5;
                if (py > canvas.height - 100) break;
                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawParticles() {
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= 0.02;
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function update() {
            if (gameState !== 'playing' || !ball.flying) return;
            
            // Wind
            if (wind.strength > 0) {
                ball.vx += wind.strength * wind.dir;
            }
            
            // Physics
            ball.vy += 0.5;
            ball.vx *= 0.995;
            ball.vy *= 0.995;
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // Trail
            if (Math.abs(ball.vx) > 1 || Math.abs(ball.vy) > 1) {
                ball.trail.push({ x: ball.x, y: ball.y });
                if (ball.trail.length > 12) ball.trail.shift();
            }
            
            // Floor
            const floor = canvas.height - 100;
            if (ball.y + ball.r > floor) {
                ball.y = floor - ball.r;
                ball.vy *= -0.7;
                ball.vx *= 0.85;
                
                if (Math.abs(ball.vy) < 1.5 && Math.abs(ball.vx) < 0.5) {
                    ball.flying = false;
                    shots--;
                    streak = 0;
                    updateHUD();
                    
                    if (shots <= 0) {
                        setTimeout(gameOver, 600);
                    } else {
                        setTimeout(resetBall, 400);
                    }
                }
            }
            
            // Walls
            if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -0.8; }
            if (ball.x + ball.r > canvas.width) { ball.x = canvas.width - ball.r; ball.vx *= -0.8; }
            if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -0.8; }
            
            // Score check
            if (ball.vy > 0 &&
                ball.x > hoop.x && ball.x < hoop.x + hoop.w &&
                ball.y > hoop.y && ball.y < hoop.y + 25) {
                nextLevel();
            }
        }
        
        function draw() {
            drawBackground();
            drawHoop();
            drawAim();
            drawBall();
            drawParticles();
        }
        
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        
        loop();
    </script>
</body>
</html>
