<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bot Shot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { font-family: 'Fredoka', sans-serif; background: #000; overflow: hidden; user-select: none; }
        #gameCanvas { display: block; }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0a0a20, #1a0a30);
        }
        .screen.active { display: flex; }
        .title-logo { font-size: 72px; font-weight: 800; color: #00ffff; text-shadow: 0 0 40px rgba(0,255,255,0.5); margin-bottom: 10px; }
        .title-sub { font-size: 24px; color: #888; margin-bottom: 40px; letter-spacing: 4px; }
        .btn {
            padding: 20px 60px; font-size: 28px; font-weight: 800; border: none; border-radius: 16px;
            cursor: pointer; font-family: inherit; background: linear-gradient(135deg, #00ff88, #00aa55);
            color: white; box-shadow: 0 10px 40px rgba(0,255,136,0.4);
        }
        .btn:active { transform: scale(0.95); }
        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .hud-item {
            background: rgba(0,0,0,0.6); padding: 12px 20px; border-radius: 12px;
            color: white; font-size: 20px; font-weight: 700;
        }
        .power-bar {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 30px; background: rgba(0,0,0,0.6); border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.2); overflow: hidden; display: none;
        }
        .power-bar.active { display: block; }
        .power-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0f0, #ff0, #f80, #f00); transition: width 0.05s; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="screen active" id="titleScreen">
        <div class="title-logo">BOT SHOT</div>
        <div class="title-sub">SPACE BASKETBALL</div>
        <button class="btn" onclick="startGame()">PLAY</button>
    </div>
    
    <div class="screen" id="gameOverScreen">
        <div class="title-logo" id="endTitle" style="font-size: 56px;">GAME OVER</div>
        <div class="title-sub" id="finalScore">Score: 0</div>
        <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
    
    <div class="hud" id="hud" style="display: none;">
        <div class="hud-item">Score: <span id="score">0</span></div>
        <div class="hud-item">Level: <span id="level">1</span></div>
        <div class="hud-item">Shots: <span id="shots">5</span></div>
    </div>
    
    <div class="power-bar" id="powerBar"><div class="power-fill" id="powerFill"></div></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = 'title';
        let score = 0, level = 1, shots = 5;
        
        // Ball
        const ball = { x: 100, y: 0, r: 20, vx: 0, vy: 0, flying: false, charging: false, power: 0, angle: 0 };
        
        // Hoop
        const hoop = { x: 400, y: 250, w: 80, h: 8 };
        
        // Stars
        const stars = [];
        for (let i = 0; i < 100; i++) stars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 2 });
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (!ball.flying) resetBall();
        }
        window.addEventListener('resize', resize);
        resize();
        
        // Input
        let dragStart = null;
        canvas.addEventListener('mousedown', onDown);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e.touches[0]); });
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0]); });
        canvas.addEventListener('mouseup', onUp);
        canvas.addEventListener('touchend', onUp);
        
        function onDown(e) {
            if (gameState !== 'playing' || ball.flying) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            if (Math.hypot(x - ball.x, y - ball.y) < 50) {
                dragStart = { x, y };
                ball.charging = true;
                document.getElementById('powerBar').classList.add('active');
            }
        }
        
        function onMove(e) {
            if (!dragStart) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ball.angle = Math.atan2(dragStart.y - y, dragStart.x - x);
            ball.power = Math.min(Math.hypot(dragStart.x - x, dragStart.y - y) / 2, 100);
            document.getElementById('powerFill').style.width = ball.power + '%';
        }
        
        function onUp() {
            if (!dragStart || !ball.charging) return;
            const speed = ball.power / 3;
            ball.vx = Math.cos(ball.angle) * speed;
            ball.vy = Math.sin(ball.angle) * speed;
            ball.flying = true;
            ball.charging = false;
            dragStart = null;
            document.getElementById('powerBar').classList.remove('active');
        }
        
        function resetBall() {
            ball.x = Math.min(80, canvas.width * 0.1);
            ball.y = canvas.height - 100;
            ball.vx = 0; ball.vy = 0;
            ball.flying = false;
            ball.power = 0;
        }
        
        function setupLevel() {
            resetBall();
            // Hoop moves right each level, simple and reliable
            const margin = 120 + (level - 1) * 30;
            hoop.x = canvas.width - margin;
            if (hoop.x < 300) hoop.x = 300;
            // Heights: 220, 280, 250 repeating
            hoop.y = [220, 280, 250][(level - 1) % 3];
            shots = 5;
            updateHUD();
        }
        
        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('shots').textContent = shots;
        }
        
        function startGame() {
            gameState = 'playing';
            score = 0; level = 1;
            document.getElementById('titleScreen').classList.remove('active');
            document.getElementById('gameOverScreen').classList.remove('active');
            document.getElementById('hud').style.display = 'flex';
            setupLevel();
        }
        
        function gameOver() {
            gameState = 'gameover';
            document.getElementById('endTitle').textContent = score > 0 ? 'NICE SHOT!' : 'GAME OVER';
            document.getElementById('finalScore').textContent = 'Score: ' + score;
            document.getElementById('gameOverScreen').classList.add('active');
            document.getElementById('hud').style.display = 'none';
        }
        
        function nextLevel() {
            score += 100 * level;
            level++;
            setupLevel();
        }
        
        function draw() {
            // Background
            const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.height);
            grad.addColorStop(0, '#1a0a2e'); grad.addColorStop(1, '#050310');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Stars
            ctx.fillStyle = '#fff';
            stars.forEach(s => { ctx.globalAlpha = 0.3 + Math.random()*0.4; ctx.beginPath(); ctx.arc(s.x*canvas.width, s.y*canvas.height, s.s, 0, Math.PI*2); ctx.fill(); });
            ctx.globalAlpha = 1;
            
            // Floor
            ctx.fillStyle = '#0a0a1e'; ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            
            // Hoop
            ctx.shadowColor = '#f80'; ctx.shadowBlur = 15;
            ctx.strokeStyle = '#f80'; ctx.lineWidth = 5; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(hoop.x, hoop.y); ctx.lineTo(hoop.x + hoop.w, hoop.y); ctx.stroke();
            ctx.shadowBlur = 0;
            
            // Aim line
            if (ball.charging) {
                ctx.strokeStyle = '#ff0'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x + Math.cos(ball.angle) * 80, ball.y + Math.sin(ball.angle) * 80); ctx.stroke();
            }
            
            // Ball
            const g = ctx.createRadialGradient(ball.x - 5, ball.y - 5, 0, ball.x, ball.y, ball.r);
            g.addColorStop(0, '#0ff'); g.addColorStop(1, '#08a');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
        }
        
        function update() {
            if (gameState !== 'playing' || !ball.flying) return;
            
            // Physics
            ball.vy += 0.5; ball.vx *= 0.99; ball.vy *= 0.99;
            ball.x += ball.vx; ball.y += ball.vy;
            
            // Floor bounce
            if (ball.y + ball.r > canvas.height - 80) {
                ball.y = canvas.height - 80 - ball.r;
                ball.vy *= -0.7; ball.vx *= 0.8;
                
                // Stop
                if (Math.abs(ball.vy) < 1 && Math.abs(ball.vx) < 0.5) {
                    ball.flying = false;
                    shots--;
                    updateHUD();
                    if (shots <= 0) setTimeout(gameOver, 500);
                    else setTimeout(resetBall, 300);
                }
            }
            
            // Walls
            if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -0.8; }
            if (ball.x > canvas.width - ball.r) { ball.x = canvas.width - ball.r; ball.vx *= -0.8; }
            if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -0.8; }
            
            // Score
            if (ball.vy > 0 && ball.x > hoop.x && ball.x < hoop.x + hoop.w && ball.y > hoop.y && ball.y < hoop.y + 20) {
                nextLevel();
            }
        }
        
        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
